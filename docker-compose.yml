services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      NOTA_HOST: 0.0.0.0
      NOTA_PORT: 7860
      NOTA_PROXY_HEADERS: 1
      NOTA_DATA_DIR: /data
    volumes:
      - ./runtime/data:/data
      - ./runtime/backups:/backups
    expose:
      - "7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: ./deploy/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config

  maintenance:
    build: .
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      NOTA_DATA_DIR: /data
    command: ["sh", "/app/deploy/maintenance-loop.sh"]
    volumes:
      - ./runtime/data:/data
    depends_on:
      app:
        condition: service_healthy
